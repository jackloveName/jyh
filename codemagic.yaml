workflows:
  ios-release:
    name: iOS Release
    max_build_duration: 60
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tykj.jyh
      vars:
        XCODE_PROJECT: JYH.xcodeproj
        XCODE_SCHEME: JYH
    scripts:
      - name: Set build number
        script: |
          cd "$CM_BUILD_DIR"
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Configure code signing
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR"
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release
      - name: Rename IPA
        script: |
          cd "$CM_BUILD_DIR"
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA artifact was produced"
            exit 1
          fi
          if [ "$(basename "$IPA_PATH")" = "jyh.ipa" ]; then
            echo "IPA is already named jyh.ipa"
            exit 0
          fi
          cp "$IPA_PATH" build/ios/ipa/jyh.ipa.tmp
          mv -f build/ios/ipa/jyh.ipa.tmp build/ios/ipa/jyh.ipa
    artifacts:
      - build/ios/ipa/jyh.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
